<style>
/* Base que o visualizador de artifacts aplicava automaticamente */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: fundo cinza enevoado, menu em pílula flutuante centralizado, conteúdo em cartões brancos macios; preto para texto e item ativo, laranja só em ações e destaques */
:root{
  --bg:#FFFFFF; --haze:#F4F4F3; --card:#FFFFFF; --card-2:#F4F4F3; --line:#ECEBE9;
  --ink:#161616; --ink-2:#5F5E5B; --ink-3:#9A9893;
  --pill:#161616; --on-pill:#FFFFFF;
  --accent:#FF5A1F; --accent-soft:#FFE9DF; --on-accent:#FFFFFF;
  --yellow:#FFC93C; --yellow-soft:#FFF5D9; --yellow-ink:#7A5800;
  --good:#1E8A4B; --good-soft:#E2F3E8;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 6px 24px rgba(0,0,0,.05);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.07);
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111;--haze:#1E1E1E;--card:#1A1A1A;--card-2:#222222;--line:#2B2B2B;
  --ink:#F3F2F0;--ink-2:#B0AEAA;--ink-3:#77756F;--pill:#F3F2F0;--on-pill:#111111;
  --accent:#FF6A33;--accent-soft:#3A2016;--yellow:#FFCE4D;--yellow-soft:#352C14;--yellow-ink:#FFCE4D;
  --good:#4CC07E;--good-soft:#14301F;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111;--haze:#1E1E1E;--card:#1A1A1A;--card-2:#222222;--line:#2B2B2B;
  --ink:#F3F2F0;--ink-2:#B0AEAA;--ink-3:#77756F;--pill:#F3F2F0;--on-pill:#111111;
  --accent:#FF6A33;--accent-soft:#3A2016;--yellow:#FFCE4D;--yellow-soft:#352C14;--yellow-ink:#FFCE4D;
  --good:#4CC07E;--good-soft:#14301F;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;position:relative;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(34vw 24vw at 50% 0%,var(--haze),transparent 70%);opacity:.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* demo */
.demo .wrap{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px;font-size:12.5px;color:var(--ink-2)}
.demo .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.demo select{border:0;background:var(--card);box-shadow:var(--shadow-sm);border-radius:999px;padding:5px 12px;font-size:12.5px;max-width:100%}

/* menu pílula */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:8px 12px;background:var(--bg)}
.top .wrap{display:flex;justify-content:center}
.navbar{display:flex;align-items:center;gap:4px;background:var(--pill);border-radius:999px;padding:6px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
.navbar::-webkit-scrollbar{display:none}
.navbar button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink-3);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap}
.navbar button:hover{color:var(--on-pill)}
.navbar button[aria-current="page"]{background:var(--on-pill);color:var(--pill);font-weight:600}

.navbar .brand+button{margin-left:2px}
.navbar button.locked{color:var(--ink-3);cursor:not-allowed}
.navbar button.locked:hover{color:var(--ink-3)}
.navbar .timer{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;background:rgba(127,127,127,.28);color:var(--on-pill);border-radius:999px;padding:2px 8px}

/* sucessão */
.suc-list{display:flex;flex-direction:column;gap:16px}
.suc{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.suc{grid-template-columns:minmax(0,1fr)}}
.suc-lead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px}
.suc-lead .info{flex:1;min-width:0}
.suc-lead .name{font-weight:700;font-size:16px;letter-spacing:-.01em}
.suc-lead .sub{font-size:13px;color:var(--ink-2)}
.suc-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.slot{border:1px dashed var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.slot.filled{border-style:solid;background:var(--card-2)}
.slot.filled.emergencial{background:var(--pill);color:var(--on-pill);border-color:transparent}
.slot.filled.emergencial .muted,.slot.filled.emergencial .slot-p .sub{color:var(--ink-3)}
.slot.filled.emergencial .deg{color:var(--accent)}
.slot.filled.imediato{background:var(--accent-soft);border-color:transparent}
.slot.filled.preparacao{background:var(--yellow-soft);border-color:transparent}
.slot-hd{display:flex;flex-direction:column;gap:1px}
.slot-hd strong{font-size:14px}
.deg{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.slot.imediato .deg{color:var(--accent)}
.slot.preparacao .deg{color:var(--yellow-ink)}
.slot-p{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 0;border-top:1px solid rgba(127,127,127,.18)}
.slot-hd+.slot-p{border-top:0}
.slot-p .x{border:0;background:none;color:inherit;opacity:.55;width:26px;height:26px;border-radius:50%;flex:none;font-size:16px;line-height:1}
.slot-p .x:hover{opacity:1;background:rgba(127,127,127,.18)}
.slot-p .info{flex:1;min-width:0}
.slot-p .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-p .sub{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot select.inline{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line)}

/* busca e sugestões na Minha rede */
.finder{margin-bottom:20px}
.finder .gs{max-width:none}
.fhd{font-size:13px;color:var(--ink-3);margin:16px 0 10px}
.sgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sg{min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px}
.sg .info{flex:1;min-width:0;line-height:1.25}
.sg .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .sub{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .x{border:0;background:none;color:var(--ink-3);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;padding:0}
.sg .x:hover{background:var(--card-2);color:var(--ink)}
.navbar .badge{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums;line-height:1}
.navbar button[aria-current="page"] .badge{background:var(--accent);color:var(--on-accent)}
.navbar .bellbtn{position:relative;padding:9px 10px}
.navbar .bellbtn .badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;font-size:10px;box-shadow:0 0 0 2px var(--pill)}
@media (prefers-reduced-motion:no-preference){.navbar .bellbtn.ring svg{animation:ring 1.2s ease 1;transform-origin:50% 10%}@keyframes ring{10%,30%{rotate:14deg}20%,40%{rotate:-14deg}50%{rotate:0deg}}}
.npanel{position:fixed;z-index:15;width:min(380px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:8px 16px 12px;max-height:min(480px,70vh);overflow:auto}
.npanel .nh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 4px}
.npanel .nh strong{font-size:15px}
.npanel .row{align-items:flex-start}
.npanel .row .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.npanel .row .when{font-size:12px;color:var(--ink-3)}
.npanel .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-top:16px}
.navbar .meav{margin-left:6px;padding:0 0 0 10px;border-left:1px solid rgba(127,127,127,.35);display:flex}

/* busca de colaboradores */
.gsearch{display:flex;justify-content:center;margin-top:12px}
.gs{position:relative;width:100%;max-width:560px}
.gs svg.i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.gs input{width:100%;padding:12px 18px 12px 44px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:var(--shadow-sm);font-size:15px}
.gs input:focus{outline:none;border-color:var(--ink)}
.gs kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:inherit;font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.gres{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:6px 14px;max-height:min(420px,60vh);overflow:auto;z-index:8}
.gres .row{gap:10px}
.gres .hd{font-size:12px;color:var(--ink-3);padding:8px 0 2px}

/* etapa */
.stagebar{display:flex;justify-content:center;margin-top:14px}
.stagepill{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:var(--shadow-sm);font-size:13px;max-width:100%}
.stagepill .steps{display:flex;gap:4px}
.stagepill .steps span{width:22px;height:4px;border-radius:9px;background:var(--line)}
.stagepill .steps span.on{background:var(--accent)}
.stagepill .steps span.done{background:var(--ink)}
.stagepill b{font-weight:600}

/* ===================== Período da rede (40 dias) ===================== */
function period(){
  const s=parse(S.rede.start),end=new Date(s.getTime()+(S.rede.days-1)*DAY),t=today();
  const elapsed=Math.floor((t-s)/DAY)+1;
  const left=Math.max(0,Math.floor((end-t)/DAY)+1);
  return {start:s,end,days:S.rede.days,day:Math.min(Math.max(elapsed,0),S.rede.days),left,notStarted:t<s,over:t>end};
}
const redeOpen=()=>{const p=period();return S.stage==='rede'&&!p.notStarted&&!p.over};

/* ===================== Regras ===================== */
const U=id=>S.users.find(u=>u.id===id);
const M=id=>S.matrizes.find(m=>m.id===id);
const me=()=>U(S.session);
const isAdmin=()=>me()&&me().role==='admin';
const ledBy=uid=>S.matrizes.filter(m=>m.leaderId===uid);
const isLeader=uid=>ledBy(uid).length>0;
const leaderOf=u=>{const m=M(u.matrizId);return m&&m.leaderId&&m.leaderId!==u.id?U(m.leaderId):null};
const colabs=()=>S.users.filter(u=>u.role!=='admin');
const connections=uid=>S.invites.filter(i=>i.status==='aceito'&&(i.from===uid||i.to===uid)).map(i=>i.from===uid?i.to:i.from).filter(U);
/* Quem cada pessoa avalia, com prioridade: líder > equipe > matriz > rede */
function targets(uid){
  const u=U(uid),t=new Map();
  connections(uid).forEach(id=>t.set(id,'rede'));
  if(u.matrizId) colabs().filter(x=>x.matrizId===u.matrizId&&x.id!==uid).forEach(x=>t.set(x.id,'matriz'));
  ledBy(uid).forEach(m=>colabs().filter(x=>x.matrizId===m.id&&x.id!==uid).forEach(x=>t.set(x.id,'equipe')));
  const l=leaderOf(u); if(l) t.set(l.id,'lider');
  return [...t].map(([id,type])=>({user:U(id),type})).filter(x=>x.user);
}
const evalOf=(a,b)=>S.evals.find(e=>e.from===a&&e.to===b);
const cargoOf=u=>u.cargo||(isLeader(u.id)?'lideranca':'analista');
const cargoName=k=>(CARGOS.find(c=>c.k===k)||{}).t||'';
const evalOpen=()=>S.stage==='avaliacao'||(TEST_EVAL&&S.stage!=='encerrado');
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const received=uid=>S.evals.filter(e=>e.to===uid);
const scoreOf=e=>avg(Object.values(e.scores).filter(v=>v!=null));
const overall=uid=>avg(received(uid).map(scoreOf));
const critAvg=(uid,k)=>avg(received(uid).filter(e=>e.scores[k]!=null).map(e=>+e.scores[k]));
/* Média do cargo: média das notas de quem tem o mesmo cargo (sem contar a própria pessoa) */
function cargoStats(cargo,exceptId){
  const ppl=colabs().filter(x=>cargoOf(x)===cargo&&x.id!==exceptId&&received(x.id).length);
  const crit={};CRIT.forEach(c=>crit[c.k]=avg(ppl.map(x=>critAvg(x.id,c.k)).filter(v=>v!=null)));
  return {n:ppl.length,overall:avg(ppl.map(x=>overall(x.id))),crit};
}
const pctDiff=(mine,ref)=>mine==null||ref==null||!ref?null:(mine/ref-1)*100;
function diffChip(p,long){
  if(p==null)return '<span class="chip">Sem base</span>';
  const r=Math.round(p*10)/10,txt=(r>0?'+':'')+r.toFixed(1).replace('.',',')+'%';
  if(Math.abs(r)<0.5)return `<span class="chip">${long?'Na média':'= média'}</span>`;
  return `<span class="chip ${r>0?'good':'orange'}">${r>0?'▲':'▼'} ${txt}${long?(r>0?' acima':' abaixo'):''}</span>`;
}
/* Graus sucessórios em que a pessoa aparece */
function sucDegrees(id){
  const out=[];Object.keys(S.succession||{}).forEach(lid=>{const x=sucOf(lid);SUC.forEach((g,i)=>{if(x[g.k].includes(id)&&U(lid))out.push({lider:U(lid),i,g})})});
  return out.sort((a,b)=>a.i-b.i);
}
const sucChips=(id,empty)=>{const d=sucDegrees(id);return d.length?d.map(x=>`<span class="chip suc${x.i}">${x.g.t} de ${esc(x.lider.name.split(' ')[0])}</span>`).join(' '):(empty?'<span class="chip">Sem grau sucessório</span>':'')};

function stagePill(){
  const si=STAGES.findIndex(s=>s.k===S.stage),p=period();
  let tag;
  if(S.stage==='rede') tag=p.notStarted?`<span class="tag ink">Abre em ${br(p.start)}</span>`:p.over?`<span class="tag ink">Prazo encerrado</span>`:`<span class="tag">Dia ${p.day} de ${p.days} · faltam ${p.left}</span>`;
  else if(S.stage==='avaliacao') tag=`<span class="tag">Avaliações abertas</span>`;
  else tag=`<span class="tag ink">Notas finais liberadas</span>`;
  return `<div class="stagepill"><span>Etapa ${si+1} de 3 · <b>${STAGES[si].t}</b></span><span class="steps">${STAGES.map((s,i)=>`<span class="${i===si?'on':i<si?'done':''}"></span>`).join('')}</span>${tag}</div>`;
}

function markSeen(){answered().forEach(i=>i.seen=true);save()}

function render(){
  const items=navItems();
  if(!items.some(i=>i[0]===view)) view=items[0][0];
  const u=me();
  if(view==='avaliar'&&evalLocked())view='rede';
  document.getElementById('nav').innerHTML='<span class="brand" role="img" aria-label="Rede 360"></span>'+items.map(([k,t])=>k==='avaliar'&&evalLocked()
    ?`<button data-go="${k}" class="locked" aria-disabled="true" title="A avaliação abre quando o período de rede terminar">${ic('lock')}<span class="lbl">${t}</span><span class="timer ctimer">${countdown()}</span></button>`
    :`<button data-go="${k}" ${k===view?'aria-current="page"':''}>${ic(k)}<span class="lbl">${t}</span>${k==='rede'&&(pendingIn().length+approvals().length)?`<span class="badge" aria-label="${pendingIn().length+approvals().length} pendências">${pendingIn().length+approvals().length}</span>`:''}</button>`).join('')
    +(isAdmin()?'':`<button class="bellbtn ${notifCount()>lastCount?'ring':''}" data-act="bell" aria-label="Notificações${notifCount()?`, ${notifCount()} novas`:''}" aria-expanded="${nOpen}">${ic('bell')}${notifCount()?`<span class="badge">${notifCount()}</span>`:''}</button>`)
    +`<span class="meav" title="${esc(u.name)}">${av(u,'sm')}</span>`;
  lastCount=notifCount();
  renderNotif();
  document.getElementById('stages').innerHTML=stagePill();
  document.getElementById('demoUser').innerHTML=S.users.map(x=>`<option value="${x.id}" ${x.id===S.session?'selected':''}>Ver como ${esc(x.name)} · ${esc(sub(x))}</option>`).join('');
  const V={rede:vRede,avaliar:vAvaliar,perfil:vPerfil,geral:vGeral,matrizes:vMatrizes,pessoas:vPessoas,sucessao:vSucessao,equipe:vEquipe,resultados:vResultados};
  document.getElementById('app').innerHTML=V[view]();
}

/* ===================== Timer da avaliação ===================== */
const evalLocked=()=>!TEST_EVAL&&S.stage==='rede';
function countdown(){
  const p=period(),diff=p.end.getTime()+DAY-Date.now();
  if(diff<=0)return 'em breve';
  const d=Math.floor(diff/DAY),h=Math.floor(diff%DAY/36e5),m=Math.floor(diff%36e5/6e4);
  return d>0?`${d}d ${String(h).padStart(2,'0')}h`:`${h}h ${String(m).padStart(2,'0')}min`;
}
setInterval(()=>document.querySelectorAll('.ctimer').forEach(el=>el.textContent=countdown()),30000);

/* ===================== Sugestões de pessoas ===================== */
const skipped=new Set();
function suggestions(id){
  const mine=new Set(connections(id));
  const taken=new Set(S.invites.filter(i=>(i.from===id||i.to===id)&&!CLOSED.includes(i.status)).map(i=>i.from===id?i.to:i.from));
  const auto=new Set(targets(id).filter(t=>t.type!=='rede').map(t=>t.user.id));
  return colabs().filter(x=>x.id!==id&&!taken.has(x.id)&&!auto.has(x.id)&&!skipped.has(x.id))
    .map(x=>({x,mut:connections(x.id).filter(c=>mine.has(c)).length}))
    .sort((a,b)=>b.mut-a.mut||a.x.name.localeCompare(b.x.name)).slice(0,8);
}

/* ===================== Busca de colaboradores ===================== */
let gq='',gOpen=false;
function personAction(x){
  const u=me();
  if(isAdmin())return `<button class="btn soft sm" data-act="gopen" data-id="${x.id}">Abrir cadastro</button>`;
  if(x.id===u.id)return '<span class="chip">Você</span>';
  const inv=pairOpen(u.id,x.id);
  const t=targets(u.id).find(y=>y.user.id===x.id);
  if(inv&&inv.status==='aceito')return '<span class="chip good">Na sua rede</span>';
  if(inv&&inv.from===u.id)return inv.status==='gestor'?'<span class="chip yellow">Aguardando gestor</span>':'<span class="chip yellow">Convite enviado</span>';
  if(inv&&inv.status==='gestor')return '<span class="chip">Convite em análise</span>';
  if(inv)return `<button class="btn accent sm" data-act="accept" data-id="${inv.id}" ${redeOpen()?'':'disabled'}>Aceitar convite</button>`;
  if(t&&t.type!=='rede')return `<span class="chip">${t.type==='lider'?'Seu líder':t.type==='equipe'?'Sua equipe':'Seus pares'}</span>`;
  return `<button class="btn sm" data-act="invite" data-id="${x.id}" ${redeOpen()?'':'disabled'}>Convidar</button>`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const el=document.getElementById('q');if(el){e.preventDefault();el.focus()}}
});

/* ===================== Rede ===================== */
let q='';
function periodCard(){
  const p=period(),pct=p.notStarted?0:p.over?100:p.day/p.days*100;
  const head=p.notStarted?`<div class="big">${Math.ceil((p.start-today())/DAY)}<small> dias para abrir</small></div>`
    :p.over||S.stage!=='rede'?`<div class="big">0<small> dias restantes</small></div>`
    :`<div class="big">${p.left}<small> ${p.left===1?'dia restante':'dias restantes'}</small></div>`;
  return `<section class="card ink period">
    <div>${head}</div>
    <div>
      <div class="small" style="font-weight:600">Período de montagem da rede · ${p.days} dias</div>
      <div class="timeline" role="img" aria-label="Dia ${p.day} de ${p.days}"><span style="width:${pct}%"></span><i style="left:${pct}%"></i></div>
      <div class="tl-labels muted"><span>Início ${br(p.start)}</span><span>${p.notStarted?'':p.over?'Encerrado':`Hoje · dia ${p.day}`}</span><span>Fim ${br(p.end)}</span></div>
    </div></section>`;
}

        <div class="list">${auto.map(t=>`<div class="row">${av(t.user,'sm')}<div class="info"><div class="name">${esc(t.user.name)}</div></div><span class="chip">${t.type==='lider'?'Líder':t.type==='equipe'?'Equipe':'Pares'}</span></div>`).join('')}</div></section>`:''}
    </div>

/* ===================== Avaliar ===================== */
function vAvaliar(){
  const u=me(),list=targets(u.id),open=evalOpen();
  const done=list.filter(x=>evalOf(u.id,x.user.id)).length,pct=list.length?Math.round(done/list.length*100):0;
  const groups=[['lider','Seu líder'],['equipe','Sua equipe'],['matriz','Seus pares'],['rede','Sua rede']];
  return `
  ${hero('Etapa 2 · Avaliação','Avalie quem <em>trabalha</em> com você',`Suas respostas sobre colegas e líder são anônimas. A pessoa vê só médias, e apenas depois de receber pelo menos ${MIN_ANON} avaliações do mesmo grupo.`)}
  ${S.stage==='rede'?(TEST_EVAL?notice('<b>Modo de teste.</b> A avaliação está liberada antes do fim do período de rede só para testes. Na versão final, ela abre quando o RH avançar para a etapa 2.'):notice('<b>A avaliação ainda não começou.</b> Ela abre quando terminar o período de rede. Veja abaixo quem você vai avaliar.')):''}
  ${S.stage==='encerrado'?notice('<b>Ciclo encerrado.</b> As avaliações não podem mais ser enviadas ou alteradas.'):''}
  <section class="card" style="margin-bottom:20px"><div class="prog"><strong class="num">${done} de ${list.length}</strong><div class="bar"><span style="width:${pct}%"></span></div><span class="num">${pct}%</span></div></section>
  <div class="stack">${groups.map(([k,t])=>{const g=list.filter(x=>x.type===k);if(!g.length)return '';return `
    <section class="card"><h2>${t} <span class="chip">${g.length}</span></h2><div class="list">${g.map(x=>{const e=evalOf(u.id,x.user.id);return `
      <div class="row">${av(x.user)}<div class="info"><div class="name">${esc(x.user.name)}</div><div class="sub">${esc(sub(x.user))} · ${esc(cargoName(cargoOf(x.user)))}</div></div>
      ${x.type==='rede'?relChip(relTo(pairOpen(u.id,x.user.id),u.id)):''}
      ${e?`<span class="chip good">Avaliado</span><button class="btn soft sm" data-act="eval" data-id="${x.user.id}" ${open?'':'disabled'}>Editar</button>`
         :`<button class="btn ${open?'accent':''} sm" data-act="eval" data-id="${x.user.id}" ${open?'':'disabled'}>Avaliar</button>`}</div>`}).join('')}</div></section>`}).join('')||'<div class="empty">Você ainda não tem ninguém para avaliar. Monte sua rede na etapa 1.</div>'}</div>`;
}

      <div class="qerr" hidden>Escolha uma nota de 0 a 10 ou marque “Em branco”.</div>
    </div>`}).join('')}
    <div class="q final field"><label for="cm">Comentário geral sobre ${first} <span class="req">obrigatório</span></label>
      <textarea id="cm" name="comment" rows="4" placeholder="Pontos fortes de ${first} e o que pode desenvolver">${esc(prev?prev.comment:'')}</textarea>

function evProgress(){
  const f=document.getElementById('evalForm');if(!f)return;
  const n=CRIT.filter(c=>f.querySelector(`input[name="${c.k}"]:checked`)).length;
  const cm=f.comment.value.trim().length;
  const b=CRIT.filter(c=>{const x=f.querySelector(`input[name="${c.k}"]:checked`);return x&&x.value==='x'}).length;
  document.getElementById('evcount').textContent=`${n} de 5 respondidas`+(b?` · ${b} em branco`:'');
  document.getElementById('cmcount').textContent=cm>=MIN_FINAL?`${cm} caracteres`:`${cm} de ${MIN_FINAL} caracteres mínimos`;
  CRIT.forEach(c=>{if(f.querySelector(`input[name="${c.k}"]:checked`))f.querySelector(`[data-q="${c.k}"] .qerr`).hidden=true});
  if(cm>=MIN_FINAL)document.getElementById('cmerr').hidden=true;
}

/* ===================== Métricas ===================== */
function metricsBlock(u,vis,final){
  const mine=avg(vis.map(scoreOf)),cs=cargoStats(cargoOf(u),u.id),p=pctDiff(mine,cs.overall),cn=cargoName(cargoOf(u));
  return `<section class="card mx">
    <div class="mx-h"><h2 style="margin:0">Seu resultado</h2>${vis.length?`<span class="chip ${final?'ink':'yellow'}">${final?'Notas finais':'Notas parciais'}</span>`:''}</div>
    <div class="mx-g">
      <div class="mx-c dark"><div class="l">Sua nota</div><div class="n num">${fmt(mine)}</div><div class="s">média geral de 0 a 10</div></div>
      <div class="mx-c"><div class="l">Média dos ${esc(cn)}</div><div class="n num">${fmt(cs.overall)}</div><div class="s">${cs.n} ${cs.n===1?'pessoa':'pessoas'} com o mesmo cargo</div></div>
      <div class="mx-c"><div class="l">Comparação com o cargo</div><div class="n num ${p==null?'':p>=0.5?'up':p<=-0.5?'down':''}">${p==null?'–':(p>0?'+':'')+p.toFixed(1).replace('.',',')+'%'}</div><div class="s">${p==null?'Sem dados suficientes':Math.abs(p)<0.5?'na média do cargo':p>0?'acima da média do cargo':'abaixo da média do cargo'}</div></div>
    </div>
    ${mine!=null&&cs.overall!=null?`<div class="scale5" aria-hidden="true"><div class="track"></div><i class="ref" style="left:${cs.overall/NMAX*100}%"><span>Cargo ${fmt(cs.overall)}</span></i><i class="me" style="left:${mine/NMAX*100}%"><span>Você ${fmt(mine)}</span></i><div class="ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div></div>`:''}
  </section>`;
}

/* ===================== Minha equipe (líder) ===================== */
function vEquipe(){
  const u=me(),team=colabs().filter(x=>ledBy(u.id).some(m=>m.id===x.matrizId)&&x.id!==u.id)
    .sort((a,b)=>(overall(b.id)??-1)-(overall(a.id)??-1));
  const withSuc=team.filter(x=>sucDegrees(x.id).length).length;
  return `
  ${hero('Liderança','Minha <em>equipe</em>','Resultado de cada pessoa do seu grupo de pares, comparado com a média de quem tem o mesmo cargo, e o grau sucessório definido pelo RH.')}
  <div class="kpis">
    <div class="card kpi"><div class="n">${team.length}</div><div class="l">Pessoas na equipe</div></div>
    <div class="card kpi"><div class="n">${fmt(avg(team.map(x=>overall(x.id)).filter(v=>v!=null)))}</div><div class="l">Média da equipe</div></div>
    <div class="card kpi"><div class="n">${withSuc}</div><div class="l">Com grau sucessório</div></div>
  </div>
  <div class="team">${team.map(x=>{const g=overall(x.id),cs=cargoStats(cargoOf(x),x.id);return `
    <section class="card tm">
      <div class="tm-h">${av(x)}<div class="info"><div class="name">${esc(x.name)}</div><div class="sub">${esc(cargoName(cargoOf(x)))}</div></div>
        <div class="tm-n"><b class="num">${fmt(g)}</b>${diffChip(pctDiff(g,cs.overall),true)}</div></div>
      <div class="tm-s">${sucChips(x.id,true)}</div>
      <div class="tm-c">${CRIT.map(c=>{const v=critAvg(x.id,c.k),ref=cs.crit[c.k];return `<div class="tm-r"><span>${c.t}</span><div class="cbar"><div class="bar"><span style="width:${(v||0)/NMAX*100}%"></span></div>${ref!=null?`<i class="ref" style="left:${ref/NMAX*100}%"></i>`:''}</div><b class="num">${fmt(v)}</b></div>`}).join('')}</div>
      <div class="small muted">Média dos ${esc(cargoName(cargoOf(x)))}: ${fmt(cs.overall)} · ${received(x.id).length} avaliações recebidas</div>
    </section>`}).join('')||'<div class="empty">Ninguém no seu grupo de pares ainda.</div>'}</div>`;
}

/* ===================== Perfil ===================== */

  const vis=Object.keys(bySrc).filter(ok).flatMap(k=>bySrc[k]);
  const hiddenN=Object.keys(bySrc).filter(k=>!ok(k)).reduce((s,k)=>s+bySrc[k].length,0);
  const ov=avg(vis.map(scoreOf));
  const compAvg=c=>avg(vis.filter(e=>e.scores[c.k]!=null).map(e=>+e.scores[c.k]));

        ${vis.length?`<div class="legend small muted"><span><i class="lg-me"></i>Sua nota</span><span><i class="lg-ref"></i>Média dos ${esc(cargoName(cargoOf(u)))}</span></div>`+allComps.map(c=>{const v=compAvg(c),ref=cs.crit[c.k];return v==null?'':`<div class="comp2"><div class="cname"><strong>${c.t}</strong><div class="small muted">${c.d}</div></div>
          <div class="cbar"><div class="bar"><span style="width:${v/NMAX*100}%"></span></div>${ref!=null?`<i class="ref" style="left:${ref/NMAX*100}%" title="Média do cargo: ${fmt(ref)}"></i>`:''}</div>
          <div class="cval"><b class="num">${fmt(v)}</b><span class="small muted num">cargo ${fmt(ref)}</span>${diffChip(pctDiff(v,ref))}</div></div>`}).join('')
        :`<div class="empty">Suas notas aparecem aqui quando você receber avaliações na etapa 2.</div>`}
        ${hiddenN?`<p class="small muted" style="margin:12px 0 0">${hiddenN} ${hiddenN===1?'avaliação aguarda':'avaliações aguardam'} mais respostas do mesmo grupo para manter o anonimato.</p>`:''}

function handlePhoto(file){
  if(!file)return;
  if(!file.type.startsWith('image/')){toast('Escolha um arquivo de imagem (JPG ou PNG)');return}
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const W=300,H=360,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const sc=Math.max(W/img.width,H/img.height),w=img.width*sc,h=img.height*sc;
    x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    me().photo=c.toDataURL('image/jpeg',.82);save();render();toast('Foto atualizada');
  };img.src=r.result};
  r.readAsDataURL(file);
}

function vGeral(){
  const cs=colabs(),si=STAGES.findIndex(s=>s.k===S.stage),p=period();
  const totalT=cs.reduce((s,u)=>s+targets(u.id).length,0);
  const conns=S.invites.filter(i=>i.status==='aceito').length;
  const pend=S.invites.filter(i=>i.status==='pendente'||i.status==='gestor').length;
  const noRede=cs.filter(u=>!connections(u.id).length).length;
  const pct=totalT?Math.round(S.evals.length/totalT*100):0;
  const late=cs.map(u=>{const t=targets(u.id);return {u,t:t.length,d:t.filter(x=>evalOf(u.id,x.user.id)).length}}).filter(x=>x.d<x.t).sort((a,b)=>a.d/a.t-b.d/b.t).slice(0,6);

/* ===================== Sucessão ===================== */
const SUC=[{k:'emergencial',t:'Sucessor Emergencial',d:'Assume de imediato se o líder sair de forma inesperada'},{k:'imediato',t:'Sucessor Imediato',d:'Pronto para assumir a liderança agora'},{k:'preparacao',t:'Sucessor Em Preparação',d:'Em desenvolvimento para assumir no futuro'}];
let sucQ='';
/* Cada grau guarda uma lista de pessoas; a mesma pessoa não fica em dois graus do mesmo líder */
function sucOf(lid){const x=S.succession[lid]||(S.succession[lid]={});SUC.forEach(g=>{if(!Array.isArray(x[g.k]))x[g.k]=x[g.k]?[x[g.k]]:[]});return x}
function vSucessao(){
  const leaders=[...new Set(S.matrizes.map(m=>m.leaderId).filter(Boolean))].map(U).filter(Boolean)
    .filter(l=>!sucQ||(l.name+' '+sub(l)).toLowerCase().includes(sucQ.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const all=[...new Set(S.matrizes.map(m=>m.leaderId).filter(Boolean))];
  const full=all.filter(id=>SUC.every(g=>sucOf(id)[g.k].length)).length;
  const none=all.filter(id=>SUC.every(g=>!sucOf(id)[g.k].length)).length;
  const noImed=all.filter(id=>!sucOf(id).emergencial.length).length;
  const opts=(lid,k)=>{const cur=sucOf(lid),taken=SUC.flatMap(g=>cur[g.k]);
    return `<option value="">+ Adicionar pessoa</option>`+colabs().filter(x=>x.id!==lid&&!taken.includes(x.id))
      .sort((a,b)=>{const ma=S.matrizes.some(m=>m.leaderId===lid&&m.id===a.matrizId),mb=S.matrizes.some(m=>m.leaderId===lid&&m.id===b.matrizId);return (mb-ma)||a.name.localeCompare(b.name)})
      .map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(sub(x))}</option>`).join('')};
  const scoreChip=id=>{const g=overall(id);return g==null?'':`<span class="chip ${g>=8?'good':g<6?'orange':'yellow'}">Média ${fmt(g)}</span>`};
  return `
  ${hero('Plano de sucessão','Graus <em>sucessórios</em>','Para cada líder, indique uma ou mais pessoas em cada grau. Pessoas do grupo de pares do líder aparecem primeiro na lista.')}
  <div class="kpis">
    <div class="card kpi"><div class="n">${all.length}</div><div class="l">Líderes</div></div>
    <div class="card kpi"><div class="n">${full}</div><div class="l">Com os 3 graus preenchidos</div></div>
    <div class="card kpi"><div class="n" style="color:var(--accent)">${noImed}</div><div class="l">Sem Sucessor Emergencial</div></div>
    <div class="card kpi"><div class="n">${none}</div><div class="l">Sem nenhum sucessor</div></div>
  </div>
  <section class="card finder"><div class="gs">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="sucq" type="search" placeholder="Pesquisar líder ou grupo de pares" value="${esc(sucQ)}" aria-label="Pesquisar líder" autocomplete="off">
  </div></section>
  <div class="suc-list">
  ${leaders.map(l=>{const cur=sucOf(l.id);return `
    <section class="card suc">
      <div class="suc-lead">${av(l)}<div class="info"><div class="name">${esc(l.name)}</div><div class="sub">${esc(sub(l))}</div></div>${scoreChip(l.id)}</div>
      <div class="suc-slots">
      ${SUC.map((g,i)=>{const ps=cur[g.k].map(U).filter(Boolean);return `
        <div class="slot ${ps.length?'filled':''} ${g.k}">
          <div class="slot-hd"><span class="deg">${i+1}º grau${ps.length?` · ${ps.length} ${ps.length===1?'pessoa':'pessoas'}`:''}</span><strong>${g.t}</strong><span class="small muted">${g.d}</span></div>
          ${ps.map(p=>`<div class="slot-p">${av(p,'sm')}<div class="info"><div class="name">${esc(p.name)}</div><div class="sub">${esc(sub(p))}${overall(p.id)!=null?' · média '+fmt(overall(p.id)):''}</div></div><button class="x" data-act="rmsuc" data-id="${l.id}" data-k="${g.k}" data-p="${p.id}" aria-label="Remover ${esc(p.name)} de ${g.t}">×</button></div>`).join('')}
          <select class="inline" aria-label="Adicionar ${g.t} de ${esc(l.name)}" data-act="setsuc" data-id="${l.id}" data-k="${g.k}">${opts(l.id,g.k)}</select>
        </div>`}).join('')}
      </div>
    </section>`}).join('')||'<div class="empty">Nenhum líder encontrado. Defina líderes na aba Pares.</div>'}
  </div>`;
}

function vResultados(){
  const rows=colabs().map(u=>{const r=received(u.id),by=k=>avg(r.filter(e=>e.type===k).map(scoreOf));
    const g=overall(u.id);return {u,n:r.length,rede:by('rede'),matriz:by('matriz'),lider:by('equipe'),equipe:by('lider'),g,p:pctDiff(g,cargoStats(cargoOf(u),u.id).overall)}})
    .filter(x=>resultTab==='todos'||x.u.matrizId===resultTab||ledBy(x.u.id).some(m=>m.id===resultTab))
    .sort((a,b)=>(b.g??-1)-(a.g??-1));
  return `
  ${hero('Resultados','Notas por <em>pessoa</em>','Médias de 0 a 10 por origem, sem contar as respostas em branco. O RH vê todos os números; cada colaborador vê só os próprios, com as regras de anonimato.')}
  <div class="tabs"><button data-act="rtab" data-k="todos" aria-pressed="${resultTab==='todos'}">Todas</button>${S.matrizes.map(m=>`<button data-act="rtab" data-k="${m.id}" aria-pressed="${resultTab===m.id}">${esc(m.name)}</button>`).join('')}</div>
  ${S.evals.length?'':notice('<b>Ainda sem avaliações.</b> Use “Gerar avaliações de exemplo” na visão geral para preencher esta tabela.')}
  <div class="kpis">${CARGOS.map(c=>{const st=cargoStats(c.k,null);return `<div class="card kpi"><div class="n">${fmt(st.overall)}</div><div class="l">Média · ${c.t}<br><span class="small">${st.n} ${st.n===1?'pessoa':'pessoas'}</span></div></div>`}).join('')}</div>
  <section class="card" style="margin-bottom:20px"><h2>Média por critério e cargo</h2><div class="tw" style="box-shadow:none"><table><thead><tr><th>Cargo</th>${CRIT.map(c=>`<th class="num">${c.t}</th>`).join('')}<th class="num">Geral</th></tr></thead><tbody>
    ${CARGOS.map(c=>{const st=cargoStats(c.k,null);return `<tr><td><strong>${c.t}</strong></td>${CRIT.map(k=>`<td class="num">${fmt(st.crit[k.k])}</td>`).join('')}<td class="num"><b>${fmt(st.overall)}</b></td></tr>`}).join('')}
  </tbody></table></div></section>
  <div class="tw"><table><thead><tr><th>Pessoa</th><th class="num">Rede</th><th class="num">Pares</th><th class="num">Do líder</th><th class="num">Da equipe</th><th class="num">Geral</th><th class="num">vs. cargo</th><th>Grau sucessório</th><th class="num">Respostas</th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td><div style="display:flex;gap:10px;align-items:center">${av(x.u,'sm')}<div><strong>${esc(x.u.name)}</strong><div class="small muted">${esc(sub(x.u))} · ${esc(cargoName(cargoOf(x.u)))}</div></div></div></td>
    <td class="num">${fmt(x.rede)}</td><td class="num">${fmt(x.matriz)}</td><td class="num">${fmt(x.lider)}</td><td class="num">${fmt(x.equipe)}</td>
    <td class="num">${x.g==null?'–':`<span class="chip ${x.g>=8?'good':x.g<6?'orange':'yellow'}">${fmt(x.g)}</span>`}</td><td class="num">${diffChip(x.p)}</td><td>${sucChips(x.u.id,false)||'<span class="muted">–</span>'}</td><td class="num">${x.n}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ===================== Eventos ===================== */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){
    if(go.classList.contains('locked')){toast('A avaliação abre em '+countdown());return}
    view=go.dataset.go;render();window.scrollTo(0,0);return}
  if(e.target.dataset&&e.target.dataset.close){document.getElementById('modal').innerHTML='';return}
  const a=e.target.closest('[data-act]');if(!a||a.tagName==='SELECT')return;
  const id=a.dataset.id,u=me();
  switch(a.dataset.act){
    case 'invite':if(!redeOpen()||pairOpen(u.id,id))return;openInvite(id);return;
    case 'approve':{const iv=S.invites.find(i=>i.id===id);iv.status='pendente';iv.approvedAt=Date.now();toast(`Aprovado. ${U(iv.to).name} já pode aceitar o convite`);break}
    case 'aprall':case 'aprsel':{const ids=a.dataset.act==='aprall'?approvals().map(i=>i.id):[...aprSel];
      ids.forEach(x=>{const iv=S.invites.find(i=>i.id===x);if(iv&&iv.status==='gestor'){iv.status='pendente';iv.approvedAt=Date.now()}});
      aprSel.clear();toast(`${ids.length} ${ids.length===1?'convite aprovado':'convites aprovados'}`);break}
    case 'rejsel':{const ids=[...aprSel];ids.forEach(x=>{const iv=S.invites.find(i=>i.id===x);if(iv&&iv.status==='gestor'){iv.status='reprovado';iv.respAt=Date.now();iv.seen=false}});
      aprSel.clear();toast(`${ids.length} ${ids.length===1?'convite não aprovado':'convites não aprovados'}`);break}
    case 'reject':{const iv=S.invites.find(i=>i.id===id);iv.status='reprovado';iv.respAt=Date.now();iv.seen=false;toast('Convite não aprovado');break}
    case 'accept':{const iv=S.invites.find(i=>i.id===id);iv.status='aceito';iv.respAt=Date.now();iv.seen=false;toast('Conexão aceita: '+U(iv.from).name+' entrou na sua rede');break}
    case 'decline':if(nOpen){nOpen=false;markSeen();render()}openDecline(id);return;
    case 'bell':if(nOpen)markSeen();nOpen=!nOpen;break;
    case 'nread':markSeen();break;
    case 'cancel':S.invites=S.invites.filter(i=>i.id!==id);toast('Convite cancelado');break;
    case 'eval':openEval(id);return;
    case 'rmphoto':u.photo=null;toast('Foto removida');break;
    case 'stage':S.stage=a.dataset.k;if(S.stage!=='rede')S.invites.forEach(i=>{if(i.status==='pendente'||i.status==='gestor')i.status='expirado'});toast('Etapa alterada para '+STAGES.find(s=>s.k===S.stage).t);break;
    case 'simulate':simulate();toast('Avaliações de exemplo geradas');break;
    case 'reset':S=seed();S.session='admin';toast('Dados restaurados');break;
    case 'askdel':delMatriz=id;break;
    case 'canceldel':delMatriz=null;break;
    case 'delm':S.matrizes=S.matrizes.filter(m=>m.id!==id);S.users.forEach(x=>{if(x.matrizId===id)x.matrizId=null});delMatriz=null;toast('Grupo excluído');break;
    case 'rtab':resultTab=a.dataset.k;break;
    case 'rmsuc':{const x=sucOf(id);x[a.dataset.k]=x[a.dataset.k].filter(p=>p!==a.dataset.p);toast(`${U(a.dataset.p).name} removido(a) de ${SUC.find(g=>g.k===a.dataset.k).t}`);break}
    case 'skip':skipped.add(id);break;
    default:return;
  }
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='demoUser'){S.session=t.value;view=null;aprSel.clear();nOpen=false;lastCount=0;save();render();window.scrollTo(0,0);return}
  if(t.id==='photo'){handlePhoto(t.files[0]);return}
  if(t.closest('#evalForm')){evProgress();return}
  if(t.id==='aprAll'){approvals().forEach(i=>t.checked?aprSel.add(i.id):aprSel.delete(i.id));render();return}
  if(t.classList&&t.classList.contains('aprck')){t.checked?aprSel.add(t.dataset.id):aprSel.delete(t.dataset.id);render();return}
  if(t.name==='reason'){const e=document.getElementById('rerr');if(e)e.hidden=true;const l=document.getElementById('rnotelbl'),n=document.getElementById('rnote'),o=t.value==='outro';if(l)l.textContent=o?'Descreva o motivo (obrigatório)':'Detalhes (opcional)';if(n)n.placeholder=o?'Explique por que está recusando':'Conte um pouco mais, se quiser';return}
  if(t.name==='rel'){const e=document.getElementById('relerr');if(e)e.hidden=true;return}
  if(t.dataset.act==='setleader'){M(t.dataset.id).leaderId=t.value||null;save();render();toast('Líder atualizado')}
  if(t.dataset.act==='setsuc'){if(!t.value)return;const x=sucOf(t.dataset.id);if(!SUC.some(g=>x[g.k].includes(t.value)))x[t.dataset.k].push(t.value);save();render();toast(`${U(t.value).name} adicionado(a) como ${SUC.find(g=>g.k===t.dataset.k).t}`);return}
  if(t.dataset.act==='setcargo'){U(t.dataset.id).cargo=t.value;save();render();toast('Cargo atualizado');return}
  if(t.dataset.act==='setmatriz'){U(t.dataset.id).matrizId=t.value||null;save();render();toast('Grupo de pares atualizado')}
});
document.addEventListener('input',e=>{
  if(e.target.closest&&e.target.closest('#evalForm')){evProgress();return}
  const t=e.target;if(t.id!=='q'&&t.id!=='pq'&&t.id!=='sucq')return;
  const pos=t.selectionStart;if(t.id==='q')q=t.value;else if(t.id==='sucq')sucQ=t.value;else pq=t.value;
  const idf=t.id;render();const el=document.getElementById(idf);el.focus();el.setSelectionRange(pos,pos);
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,d=new FormData(f);
  if(f.id==='declineForm'){
    const reason=d.get('reason'),note=(d.get('note')||'').trim(),err=document.getElementById('rerr');
    if(!reason){err.textContent='Escolha um motivo para a recusa.';err.hidden=false;return}
    if(reason==='outro'&&note.length<5){err.textContent='Descreva o motivo em pelo menos 5 caracteres.';err.hidden=false;document.getElementById('rnote').focus();return}
    const iv=S.invites.find(i=>i.id===f.dataset.id);
    if(iv&&iv.status==='pendente'){Object.assign(iv,{status:'recusado',reason,reasonNote:note,respAt:Date.now(),seen:false})}
    document.getElementById('modal').innerHTML='';toast(`Convite recusado. ${U(iv.from).name} vai ver o motivo.`);
  }
  if(f.id==='inviteForm'){
    const rel=d.get('rel'),to=f.dataset.to,u=me();
    if(!rel){document.getElementById('relerr').hidden=false;return}
    if(!redeOpen()||pairOpen(u.id,to)){document.getElementById('modal').innerHTML='';return}
    const ap=approverFor(u.id,to);
    S.invites.push({id:uid(),from:u.id,to,rel,status:ap?'gestor':'pendente',approver:ap,at:Date.now()});
    document.getElementById('modal').innerHTML='';
    toast(ap?`Convite enviado como ${REL[rel].t.toLowerCase()}. Aguardando aprovação de ${U(ap).name}`:`Convite enviado para ${U(to).name} como ${REL[rel].t.toLowerCase()}`);
  }
  if(f.id==='evalForm'){
    const type=f.dataset.type,scores={},notes={};let bad=null;
    CRIT.forEach(c=>{const v=d.get(c.k);if(!v){f.querySelector(`[data-q="${c.k}"] .qerr`).hidden=false;bad=bad||f.querySelector(`[data-q="${c.k}"]`)}else scores[c.k]=v==='x'?null:+v;const n=(d.get('note_'+c.k)||'').trim();if(n)notes[c.k]=n});
    const comment=d.get('comment').trim();
    if(comment.length<MIN_FINAL){document.getElementById('cmerr').hidden=false;bad=bad||f.querySelector('.final')}
    if(bad){bad.scrollIntoView({behavior:'smooth',block:'center'});toast(Object.keys(scores).length<5?'Responda os 5 critérios':'O comentário geral é obrigatório');return}
    const ex=evalOf(me().id,f.dataset.to),cargo=cargoOf(U(f.dataset.to));
    if(ex)Object.assign(ex,{scores,notes,comment,type,cargo});else S.evals.push({from:me().id,to:f.dataset.to,type,cargo,scores,notes,comment});
    document.getElementById('modal').innerHTML='';toast('Avaliação enviada');
  }
  if(f.id==='profileForm'){const n=d.get('name').trim();if(!n){toast('Digite um nome');return}me().name=n;toast('Perfil salvo')}
  if(f.id==='periodForm'){S.rede={start:d.get('start'),days:Math.max(1,parseInt(d.get('days'))||40)};toast('Período da rede salvo')}
  if(f.id==='mForm'){S.matrizes.push({id:'m'+uid(),name:d.get('name').trim(),leaderId:d.get('leader')||null});toast('Grupo adicionado')}
  if(f.id==='pForm'){
    const email=d.get('email').trim().toLowerCase();
    if(S.users.some(x=>x.email===email)){toast('Já existe alguém com esse e-mail');return}
    S.users.push({id:'u'+uid(),name:d.get('name').trim(),email,role:'colab',matrizId:d.get('matriz')||null,cargo:d.get('cargo'),photo:null});toast('Colaborador adicionado');
  }
  save();render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('modal').innerHTML='';if(nOpen){nOpen=false;markSeen();render()}}});

const COMMENTS=['Sempre disposta a ajudar quando o time aperta. Pode compartilhar mais o andamento das entregas.','Comunica bem as prioridades da semana e escuta o time antes de decidir.','Traz soluções antes de o problema crescer. Poderia delegar mais.','Muito respeitoso nas reuniões e atento ao cliente. Pode arriscar mais ideias novas.'];
const NOTES={res:'Manteve a calma no fechamento do trimestre.',cri:'Propôs um jeito novo de organizar a fila de pedidos.',pro:'Avisou do atraso do fornecedor antes de virar problema.',col:'Ajudou outra área durante a migração do sistema.',emp:'Ouviu o cliente com paciência antes de sugerir algo.'};
function simulate(skip=[],rnd=Math.random){
  colabs().forEach(u=>{if(skip.includes(u.id))return;targets(u.id).forEach(({user,type})=>{
    if(evalOf(u.id,user.id)||rnd()<.15)return;
    const base=5.2+rnd()*4,scores={};
    const notes={};CRIT.forEach(c=>{scores[c.k]=rnd()<.07?null:Math.max(0,Math.min(10,Math.round(base+(rnd()-.5)*3.2)));if(rnd()<.2)notes[c.k]=NOTES[c.k]});
    S.evals.push({from:u.id,to:user.id,type,cargo:cargoOf(user),scores,notes,comment:COMMENTS[Math.floor(rnd()*COMMENTS.length)]});
  })});
}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* Avaliações de exemplo para os resultados aparecerem; a Ana fica livre para testar o formulário */
if(!S.seeded){simulate(['u1'],rng(360));S.succession.l3={emergencial:['u8'],imediato:[],preparacao:['u11','u9']};S.seeded=true;save()}
render();
